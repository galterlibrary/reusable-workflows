name: Test InvenioRDM package - Python

# Assumes repository defines a `dev` extra and uses `invoke` as test-runner

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python versions"
        type: string
        # NOTE: There is no "array" type, so we use "string" and parse it in the matrix
        default: '["3.14"]'
      extras:
        description: "Extra dependencies"
        type: string
        default: 'dev'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
          python-version: ${{ fromJson(inputs.python-version) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          pip install --upgrade pip hatch

      - name: Install dependencies
        run: |
          pip install .[${{ inputs.extras }}]
          pip freeze

      - name: Run tests
        run: |
          invoke test --no-color
